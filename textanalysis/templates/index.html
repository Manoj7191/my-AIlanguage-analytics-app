<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Analysis Review System</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            justify-content: space-between;
            width: 80%;
            max-width: 1200px;
            padding: 20px;
            border-radius: 20px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .upload-section {
            width: 45%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        .results-section {
            width: 90%;
            padding-left: 20px;
            border-left: 2px solid #ddd;
            overflow-y: auto;
        }

        .results-section h2 {
            margin-bottom: 10px;
        }

        frg {
            color: #26b72b;
        }

        frl {
            color: #8632b3;
            font-size: 15px;
        }

        pre {
            white-space: pre-wrap; /* Preserve line breaks */
            overflow-x: auto;
            max-height: 1200px; /* Limit height for better readability */
            text-align: left;  /* Left-align the results */
            margin-top: 30px;
        }

        img {
            max-width: 100%;
            max-height: 300px; /* Restrict image height for better layout */
            object-fit: contain; /* Preserve image aspect ratio */
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Upload Section -->
        <div class="upload-section">
            <h1>Google Review Analysis System</h1>
            <form action="{{ url_for('process_data') }}" method="POST">
                <p>Enter the location which needs analysis</p>
                <p><input type="text" name="location"/></p>
                <input type="submit" value="Submit">
            </form>
        </div>

        <!-- Results Section -->
        <div class="results-section">
            {% if results %}
                <h2>Analysis Results:</h2>
                   <pre>{{ results|safe }}</pre>
            {% else %}
                <p>No results available yet. Please enter a location.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
